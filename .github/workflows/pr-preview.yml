# PRごとのプレビュー（gh-pages ブランチの pr-preview/pr-<番号>/ に配信し、PRにURLをコメントする。PRを閉じると消す）。
# - ビルドは書き込み権限の無いジョブで行い、配信のジョブは npm を実行しない（依存パッケージのスクリプトに書き込みの権限を渡さない）
# - プレビューは本番と別の名前空間に保存する（VITE_PR_PREVIEW。src/domain/persistence.ts の storageNamespace）
# - このリポジトリのブランチからのPRだけが対象（フォークのPRには書き込みの権限が無い）。Dependabot のPRは対象外
name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

# 同じPRへの続けてのpushで、前の配信と競合しないようにする
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: プレビュー用のパスでビルド
        run: npm run build
        env:
          BASE_PATH: /project_management_poc/pr-preview/pr-${{ github.event.number }}/
          VITE_PR_PREVIEW: ${{ github.event.number }}
      - name: ビルド成果物にデータファイルが無いことを確認
        run: sh scripts/check-dist.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist
          path: dist
          retention-days: 1

  preview:
    needs: build
    # PRを閉じたとき（build は動かない）はプレビューを消す。それ以外は build が成功したときだけ配信する
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action == 'closed' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event.action != 'closed'
        with:
          name: preview-dist
          path: dist
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./dist
          action: auto
