# CI と GitHub Pages への配信（CLAUDE.md 6.1・6.4、docs/security/checklist.md F）。
# 配信は main への push で、ほかのジョブがすべて成功したときだけ行う。
# Action はすべてコミット sha で固定する（Dependabot が sha と末尾のバージョンコメントを更新する）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: 型チェック
        run: npm run typecheck
      - name: 単体テスト（@security を含む全件）
        run: npm test

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 本番依存の脆弱性（high/critical は失敗）
        run: npm audit --omit=dev --audit-level=high
      - name: 開発依存を含む脆弱性（結果の表示のみ）
        run: npm audit || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PRへのコメントには書き込み権限が要るため使わない（結果はジョブのログで見る）
          GITLEAKS_ENABLE_COMMENTS: "false"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: ビルド成果物にデータファイルが無いことを確認
        run: sh scripts/check-dist.sh
      # 配信するのは、この（書き込み権限の無い）ジョブで作ったビルド成果物だけ
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist
          retention-days: 1

  # gh-pages ブランチへ push する方式で配信する（PRプレビューの pr-preview/ 配下と共存させるため。
  # actions/deploy-pages はサイト全体を毎回置き換えるので共存できない）。
  # 書き込み権限を持つのはこのジョブだけで、npm は実行しない（依存パッケージのスクリプトに書き込みの権限を渡さない）
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, dependency-audit, secret-scan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-main
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # PRプレビュー（pr-preview/ 配下）を本番の配信のたびに消さない。過去のビルドのファイルが残るが、PoCの規模では許容する
          keep_files: true
